<div class="login-page">
    <div class="login-container">
      <mat-card class="login-card">
        <div class="logo-container">
            <img src="../../../../assets/logo-no-background.png" alt="Logo" class="logo" />
        </div>
        <h2 style="font-family: 'Roboto Mono'  !important; font-weight: bold;">WELCOME BACK</h2>
        <p>Please sign in to continue</p>
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" required>
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
              Enter a valid email
            </mat-error>
          </mat-form-field>
          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" required>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>
          <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="loginForm.invalid">
            Sign In
          </button>
          <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
        </form>
        <div class="footer">
          <span>Don't have an account?</span>
          <a routerLink="/auth/register">Register</a>
        </div>
      </mat-card>
    </div>
  </div>
