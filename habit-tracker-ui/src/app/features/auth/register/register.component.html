<div class="register-page">
    <div class="register-container">
      <mat-card class="register-card">
        <div class="logo-container">
          <img src="../../../../assets/logo-no-background.png" alt="Logo" class="logo" />
        </div>
        <h2 style="font-family: 'Roboto Mono'; font-weight: bold;">CREATE YOUR ACCOUNT</h2>
        <p>Sign up to start tracking your habits</p>
        <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" required>
            <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
              Enter a valid email
            </mat-error>
          </mat-form-field>
          
          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" required>
            <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>
          
          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Full Name</mat-label>
            <input matInput type="text" formControlName="fullName" required>
            <mat-error *ngIf="registerForm.get('fullName')?.hasError('required')">
              Full name is required
            </mat-error>
          </mat-form-field>
          
          <button mat-raised-button color="primary" type="submit" class="full-width"
            [disabled]="registerForm.invalid">
            Sign Up
          </button>
          <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
        </form>
        <div class="footer">
          <span>Already have an account?</span>
          <a routerLink="/auth/login">Login</a>
        </div>
      </mat-card>
    </div>
  </div>
