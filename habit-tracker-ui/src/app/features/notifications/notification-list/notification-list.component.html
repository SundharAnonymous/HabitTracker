<div class="notifications-page">
    <div class="header-banner">
      <h1 style="font-family: 'Roboto Mono';">My Notifications</h1>
      <p>Stay updated with your latest notifications.</p>
    </div>
  
    <div class="actions">
      <button mat-raised-button color="accent" routerLink="/notifications/create">
        <mat-icon>add_circle</mat-icon> New Notification
      </button>
    </div>
  
    <div class="notifications-grid">
      <mat-card *ngFor="let notif of notifications" class="notification-card">
        <mat-card-header>
          <mat-card-title>{{ notif.message }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p><strong>Scheduled:</strong> {{ notif.scheduledTime | date:'short' }}</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="warn" (click)="deleteNotification(notif.id)">
            <mat-icon style="font-family: 'Material Icons' !important;">delete</mat-icon> Delete
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
