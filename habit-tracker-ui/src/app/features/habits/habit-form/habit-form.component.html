<div class="habit-form-page">
    <div class="habit-form-container">
      <mat-card class="habit-card">
        <mat-card-header>
          <mat-card-title>{{ habitId ? 'Edit Habit' : 'Create Habit' }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <form [formGroup]="habitForm" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Title</mat-label>
              <input matInput formControlName="title" required>
              <mat-error *ngIf="habitForm.get('title')?.hasError('required')">
                Title is required
              </mat-error>
            </mat-form-field>
  
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Description</mat-label>
              <textarea matInput formControlName="description"></textarea>
            </mat-form-field>
  
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Frequency</mat-label>
              <input matInput formControlName="frequency" placeholder="e.g., Daily, Weekly" required>
              <mat-error *ngIf="habitForm.get('frequency')?.hasError('required')">
                Frequency is required
              </mat-error>
            </mat-form-field>
  
            <div class="date-time-group">
              <mat-form-field appearance="outline" class="half-width">
                <mat-label>Start Date</mat-label>
                <input matInput [matDatepicker]="startPicker" formControlName="startDate" required>
                <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
                <mat-datepicker #startPicker></mat-datepicker>
                <mat-error *ngIf="habitForm.get('startDate')?.hasError('required')">
                  Start date is required
                </mat-error>
              </mat-form-field>
  
              <mat-form-field appearance="outline" class="half-width">
                <mat-label>End Date</mat-label>
                <input matInput [matDatepicker]="endPicker" formControlName="endDate">
                <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
                <mat-datepicker #endPicker></mat-datepicker>
              </mat-form-field>
            </div>
  
            <!-- <mat-form-field appearance="outline" class="full-width">
              <mat-label>Reminder Time</mat-label>
              <input matInput type="time" formControlName="reminderTime">
            </mat-form-field> -->
  
            <button mat-raised-button color="accent" type="submit" class="submit-button" [disabled]="habitForm.invalid">
              {{ habitId ? 'Update Habit' : 'Create Habit' }}
            </button>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
