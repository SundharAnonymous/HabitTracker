<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #drawer mode="side" [opened]="isDesktop" class="sidenav">
      <!-- Logo -->
      <div class="menu-header">
        <img src="../../../../assets/logo-no-background.png" alt="Logo" class="logo" />
      </div>
      <mat-nav-list>
        <a mat-list-item class="custom-list-item" routerLink="/habits" routerLinkActive="active-menu" [routerLinkActiveOptions]="{ exact: true }">
          Habits
        </a>
        <a mat-list-item routerLink="/ai" routerLinkActive="active-menu" [routerLinkActiveOptions]="{ exact: true }">
          AI Recommendations
        </a>
        <a mat-list-item routerLink="/notifications" routerLinkActive="active-menu">
          Notifications
        </a>
        <a mat-list-item routerLink="/gamification" routerLinkActive="active-menu">
          Gamification
        </a>
        <a mat-list-item routerLink="/analytics" routerLinkActive="active-menu">
          Analytics
        </a>
        <ng-container *ngIf="authService.isLoggedIn(); else notLoggedIn">
          <a mat-list-item (click)="logout()">Logout</a>
        </ng-container>
        <ng-template #notLoggedIn>
          <a mat-list-item routerLink="/auth/login" routerLinkActive="active-menu">Login</a>
          <a mat-list-item routerLink="/auth/register" routerLinkActive="active-menu">Register</a>
        </ng-template>
      </mat-nav-list>
    </mat-sidenav>
  
    <!-- Main Content -->
    <mat-sidenav-content [class.content-shift]="isMobile && drawer.opened">
      <mat-toolbar color="primary">
        <button mat-icon-button (click)="drawer.toggle()">
          <mat-icon style="font-family: 'Material Icons' !important;">menu</mat-icon>
        </button>
        <span class="heading">HABIT TRACKER</span>
      </mat-toolbar>
      <div class="content">
        <router-outlet></router-outlet>
      </div>
      <!-- Simple Footer -->
      <footer class="footer" style="text-align: center; padding: 1rem; background-color: #f5f5f5;">
        <p>&copy; 2025 Habit Tracker. All rights reserved.</p>
      </footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
